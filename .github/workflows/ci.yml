name: Backend CI

on:
  push:
    branches:
      - main
      - graduation/refactor-testing
  pull_request:
    branches:
      - main
      - graduation/refactor-testing

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run integration tests
        run: npm run test:e2e

      - name: Build backend
        run: npm run build
